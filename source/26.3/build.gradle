plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.13'
    id 'java'
}

group = 'org.hohigamer.nbtviewer'
version = '2.3.3'

base {
    archivesName = 'NamNBTview'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.161.0+26.3'
    implementation('me.shedaniel.cloth:cloth-config-fabric:26.3.159') {
        exclude group: 'net.fabricmc.fabric-api'
    }
    compileOnly 'com.terraformersmc:modmenu:21.0.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.named('jar') {
    archiveBaseName.set('NamNBTview')
    archiveVersion.set('2.3.3-mc26.3-fabric')
}

tasks.named('sourcesJar') {
    archiveBaseName.set('NamNBTview')
    archiveVersion.set('2.3.3-mc26.3-fabric')
}
